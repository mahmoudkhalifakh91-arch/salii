plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.salli.salli_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId = "com.salli.salli_app"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // لا نوقّع نسخة الإصدار بمفتاح debug أبدًا: لو مفيش keystore البناء يفشل
            // برسالة واضحة بدل ما يطلع AAB بتوقيع غلط ترفضه Google Play.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find {
        it.name.toLowerCase().contains("release") &&
            (it.name.startsWith("bundle") || it.name.startsWith("assemble") || it.name.startsWith("package"))
    }
    if (releaseTask != null && !keystorePropertiesFile.exists()) {
        throw new GradleException(
            "android/key.properties غير موجود: لا يمكن بناء نسخة Release موقّعة. " +
            "أنشئ key.properties (storeFile/storePassword/keyAlias/keyPassword) أو اضبط التوقيع في Codemagic.")
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation "androidx.core:core-ktx:1.13.1"
}
