workflows:
  android-workflow:
    name: Salli Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.salli.salli_app"
    cache:
      cache_paths:
        - ~/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Clean workspace (avoid stale build artifacts filling disk)
        script: |
          flutter clean
          rm -rf $HOME/.gradle/caches/transforms-*
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build debug APK (fast sanity build)
        script: |
          flutter build apk --debug --verbose
      - name: Prepare release signing (from Codemagic environment variables)
        script: |
          # أضف المتغيرات دي في Codemagic (Environment variables، مشفّرة):
          # CM_KEYSTORE_PATH (مسار ملف الـ keystore بعد رفعه)، CM_KEYSTORE_PASSWORD،
          # CM_KEY_ALIAS، CM_KEY_PASSWORD. لو مش موجودة وفي android/key.properties
          # موجود أصلاً، هيُستخدم.
          if [ -n "$CM_KEYSTORE_PATH" ]; then
            cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          fi
      - name: Build release AAB (for Play Store upload)
        script: |
          flutter build appbundle --release --build-number=$BUILD_NUMBER --verbose
    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/mapping.txt
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - sadat.planning.officer@dakahlia.net
        notify:
          success: true
          failure: true
